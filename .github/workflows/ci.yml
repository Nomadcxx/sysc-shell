name: CI
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same branch or PR so a burst of pushes does
# not queue a full build each.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The panel layout tests measure text with the configured family
      # (config.Default() names Inter). Without it the runner falls back to
      # sans-serif, which is wider, and the fit assertions fail.
      - name: install test fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-inter
      - name: font diagnostics
        run: |
          echo "fc-match Inter: $(fc-match Inter 2>&1 || true)"
          echo "inter files: $(fc-list 2>/dev/null | grep -ci inter || echo 0)"
          ls -d /usr/share/fonts/* 2>/dev/null | head -20
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...
