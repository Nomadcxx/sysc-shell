name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      # README screenshots and wordmark art. Skip wider image globs: two PNGs
      # under internal/render are go:embed inputs, and testdata/ carries binary
      # fixtures, so an image-only change there still needs a run. paths-ignore
      # cannot re-include a path with '!', so those dirs stay out of the list.
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'

# Supersede in-flight runs for the same branch or PR so a burst of pushes does
# not queue a full build each. Default-branch pushes are exempt: every merge to
# main gets its own full run and verdict instead of a "cancelled" result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Recorder integration tests build the plugin from this pinned checkout.
      - uses: actions/checkout@v4
        with:
          repository: Nomadcxx/sysc-plugins
          ref: 0cea6f74a0c917b0edacf3832304caad021f51c7
          path: testdeps/sysc-plugins
      # Panel layout tests measure text with the configured family
      # (config.Default() names Inter). Installing it keeps runner metrics
      # close to the maintainer's machine instead of the fallback face.
      # raster.FindFont in sysc-terminal probes the Arch font layout, so Noto
      # is installed and the probed directory is pointed at the Ubuntu one.
      - name: install test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-core
          sudo mkdir -p /usr/share/fonts/noto
          sudo ln -sf /usr/share/fonts/truetype/noto/NotoSansMono-Regular.ttf \
            /usr/share/fonts/noto/NotoSansMono-Regular.ttf
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        env:
          SYSC_PLUGINS_DIR: ${{ github.workspace }}/testdeps/sysc-plugins
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...
