<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-kerning="normal">
<defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#bec6dc"/></linearGradient><linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#246eaa"/></linearGradient><linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#984e16"/></linearGradient><linearGradient id="gE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#ff5449"/></linearGradient></defs>
<rect width="980" height="560" fill="#f4f2ee"/>
<text x="48" y="44" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">CARRYING THE DESIGN ACROSS SURFACES</text><text x="48" y="70" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1c1a17">The same four metrics, three places</text><text x="48" y="90" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#56504a">A ring is a glance and a graph is a history. What they share is the reading contract.</text><text x="48" y="126" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">BAR WIDGET · 22px ring</text><rect x="48" y="136" width="150" height="49" rx="8" fill="#1d2025"/><rect x="60" y="148" width="126" height="25" rx="12" fill="#3a4149"/><circle cx="77.0" cy="160.5" r="10.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="77.0" cy="160.5" r="10.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="26.39 62.83" transform="rotate(-90 77.0 160.5)"/><circle cx="105.0" cy="160.5" r="10.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="105.0" cy="160.5" r="10.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="15.71 62.83" transform="rotate(-90 105.0 160.5)"/><circle cx="133.0" cy="160.5" r="10.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="133.0" cy="160.5" r="10.0" fill="none" stroke="url(#gT)" stroke-width="2" stroke-linecap="round" stroke-dasharray="40.84 62.83" transform="rotate(-90 133.0 160.5)"/><text x="133.0" y="160.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="8" font-weight="600" fill="#e6e6e6">65°</text><text x="48" y="204" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#56504a">Identity by glyph, value by tooltip —</text><text x="48" y="219" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#56504a">the one sanctioned exception to P1.</text><text x="260" y="126" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#0f766e">CONTROL CENTRE HOME · 40px ring · approved</text><rect x="260" y="136" width="380" height="112" rx="8" fill="#1d2025"/><rect x="272" y="148" width="356" height="88" rx="12" fill="#3a4149"/><circle cx="319.5" cy="183.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="319.5" cy="183.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="50.14 119.38" transform="rotate(-90 319.5 183.0)"/><text x="319.5" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#e6e6e6">42%</text><text x="319.5" y="216" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">CPU</text><circle cx="405.5" cy="183.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="405.5" cy="183.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="29.85 119.38" transform="rotate(-90 405.5 183.0)"/><text x="405.5" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#e6e6e6">25%</text><text x="405.5" y="216" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">Memory</text><circle cx="491.5" cy="183.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="491.5" cy="183.0" r="19.0" fill="none" stroke="url(#gT)" stroke-width="2" stroke-linecap="round" stroke-dasharray="77.60 119.38" transform="rotate(-90 491.5 183.0)"/><text x="491.5" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#e6e6e6">65°</text><text x="491.5" y="216" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">Temp</text><circle cx="577.5" cy="183.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="577.5" cy="183.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="83.57 119.38" transform="rotate(-90 577.5 183.0)"/><text x="577.5" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#e6e6e6">70%</text><text x="577.5" y="216" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">GPU</text><text x="260" y="204" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#56504a">Four metrics at a glance. The ring is the mark, the value lives</text><text x="260" y="219" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#56504a">inside it, the caption names it.</text><text x="48" y="262" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">SYSTEM MONITOR CONSOLE · graph card</text><rect x="48" y="272" width="646" height="128" rx="8" fill="#1d2025"/><rect x="60" y="284" width="303" height="104" rx="12" fill="#3a4149"/><text x="69" y="309" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#e6e6e6">CPU</text><g transform="translate(69,319)"><polyline points="0,44 24,38 48,41 72,28 96,33 120,20 144,26 168,14 192,22 216,11 240,18 264,9 285,15" fill="none" stroke="#0080ff" stroke-width="1.5"/></g><text x="69" y="385" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">42%</text><text x="115" y="385" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">65°C</text><rect x="371" y="284" width="303" height="104" rx="12" fill="#3a4149"/><text x="380" y="309" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#e6e6e6">GPU</text><g transform="translate(380,319)"><polyline points="0,30 24,26 48,31 72,18 96,24 120,12 144,19 168,8 192,16 216,6 240,13 264,4 285,10" fill="none" stroke="#0080ff" stroke-width="1.5"/></g><text x="380" y="385" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">70%</text><text x="426" y="385" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#9aa0a6">NVIDIA 2b:00.0</text><text x="48" y="418" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#56504a">History, not glance. Temperature rides the CPU card's legend as a second chip rather than claiming its own card.</text><text x="48" y="452" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">THE CONTRACT EVERY SURFACE KEEPS</text><text x="48" y="472" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P1 names itself</text><text x="190" y="472" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">A visible label carries identity — never colour, ring or position alone. Bar excepted: glyph plus tooltip.</text><text x="48" y="487" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P2 value with its mark</text><text x="190" y="487" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">Inside the ring on Home; in the legend under its own graph on the console.</text><text x="48" y="502" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P3 geometry survives</text><text x="190" y="502" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">Unavailable keeps the box and draws a dash. No stale value, no fabricated zero, no reflow.</text><text x="48" y="517" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P4 zero is a reading</text><text x="190" y="517" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">0% and 0°C render as themselves and never as the unavailable dash.</text><text x="48" y="532" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P5 one GPU identity</text><text x="190" y="532" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">selectGPU is the only chooser. Ambiguous devices go unavailable, never a list position.</text><text x="48" y="547" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#9a3412">P6 text scales</text><text x="190" y="547" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#3a3530">Interior type derives from the box it sits in. No fixed 8px in a container whose size varies.</text>
</svg>
