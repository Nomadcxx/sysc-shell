<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-kerning="normal">
<defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#bec6dc"/></linearGradient><linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#246eaa"/></linearGradient><linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#984e16"/></linearGradient><linearGradient id="gE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0080ff"/><stop offset="1" stop-color="#ff5449"/></linearGradient></defs>
<rect width="900" height="420" fill="#f4f2ee"/>
<text x="48" y="44" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#a16207">OPTION C · VIABLE, AT A COST</text><text x="48" y="70" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1c1a17">Grow the System card to 128px</text><text x="48" y="90" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#56504a">Keeps the card title and the label-beside-ring reading. Home begins to scroll.</text><rect x="126" y="108" width="404" height="176" rx="10" fill="#1d2025"/><rect x="150" y="132" width="356" height="128" rx="12" fill="#3a4149"/><text x="159" y="157" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#e6e6e6">System</text><circle cx="179.0" cy="187.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="179.0" cy="187.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="50.14 119.38" transform="rotate(-90 179.0 187.0)"/><text x="208" y="181" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">CPU</text><text x="208" y="200" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">42%</text><circle cx="352.0" cy="187.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="352.0" cy="187.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="29.85 119.38" transform="rotate(-90 352.0 187.0)"/><text x="381" y="181" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">Memory</text><text x="381" y="200" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">25%</text><circle cx="179.0" cy="231.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="179.0" cy="231.0" r="19.0" fill="none" stroke="url(#gT)" stroke-width="2" stroke-linecap="round" stroke-dasharray="77.60 119.38" transform="rotate(-90 179.0 231.0)"/><text x="179.0" y="231.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="8" font-weight="600" fill="#e6e6e6">65°</text><text x="208" y="225" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">CPU temp</text><text x="208" y="244" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">65°C</text><circle cx="352.0" cy="231.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="352.0" cy="231.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="83.57 119.38" transform="rotate(-90 352.0 231.0)"/><text x="381" y="225" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">GPU</text><text x="381" y="244" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">70%</text><line x1="540" y1="132" x2="540" y2="260" stroke="#8a827a" stroke-width="1"/><line x1="537" y1="132" x2="543" y2="132" stroke="#8a827a" stroke-width="1"/><line x1="537" y1="260" x2="543" y2="260" stroke="#8a827a" stroke-width="1"/><text x="546" y="199.5" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">128 card</text><text x="48" y="310" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">WHAT MOVES</text><text x="48" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">ccCardH (System only)</text><text x="230" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">88</text><text x="270" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">→</text><text x="290" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">128</text><text x="48" y="347" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">left column</text><text x="230" y="347" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">182</text><text x="270" y="347" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">→</text><text x="290" y="347" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">222</text><text x="48" y="364" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">ccPageH</text><text x="230" y="364" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">480</text><text x="270" y="364" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">→</text><text x="290" y="364" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">520</text><text x="48" y="381" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">scroll viewport</text><text x="230" y="381" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">480</text><text x="270" y="381" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">→</text><text x="290" y="381" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">480 unchanged</text><text x="430" y="310" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">THE CONSEQUENCE IS SCROLL, NOT CLIPPING</text><text x="430" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">Home already sits in a KindScroll viewport of exactly 480px</text><text x="430" y="347" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">inside a 700x564 panel, with 2px of slack. The panel does not</text><text x="430" y="364" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">resize and no other Control Centre section is touched — each</text><text x="430" y="381" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">carries its own page height.</text>
</svg>
