-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">MEASURED OVERFLOW · real font metrics</text><text x="48" y="320" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">75%</text><text x="110" y="320" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">69 / 70</text><text x="190" y="320" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#0f766e">fits</text><text x="48" y="337" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">100%</text><text x="110" y="337" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">74 / 70</text><text x="190" y="337" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#b91c1c">overflows 4px</text><text x="48" y="354" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">125%</text><text x="110" y="354" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">83 / 70</text><text x="190" y="354" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#b91c1c">overflows 13px</text><text x="48" y="371" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">150%</text><text x="110" y="371" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">99 / 70</text><text x="190" y="371" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#b91c1c">overflows 29px</text><text x="48" y="388" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">200%</text><text x="110" y="388" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">—</text><text x="190" y="388" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#b91c1c">layout returns an error</text><text x="400" y="300" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">WHY THE GUARD TEST DOES NOT CATCH IT</text><text x="400" y="320" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#1c1a17">TestControlCentreHomeSystemGaugesFitInsideCardBounds</text><text x="400" y="337" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">measures every string as 16px tall. The real title is 22px,</text><text x="400" y="354" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">and the comment above ccResourceRowH derives its fit from</text><text x="400" y="371" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#1c1a17">that same wrong 16.</text>
