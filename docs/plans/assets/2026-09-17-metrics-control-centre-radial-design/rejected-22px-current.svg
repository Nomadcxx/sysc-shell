<text x="48" y="44" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#b91c1c">REJECTED · ON MAIN TODAY</text><text x="48" y="70" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#1c1a17">22px rings, two rows</text><text x="48" y="90" text-anchor="start" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#56504a">The second row paints outside the card at the default font scale.</text><rect x="126" y="108" width="404" height="164" rx="10" fill="#1d2025"/><rect x="150" y="132" width="356" height="88" rx="12" fill="#3a4149"/><text x="159" y="157" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="600" fill="#e6e6e6">System</text><circle cx="170.0" cy="178.0" r="10.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="170.0" cy="178.0" r="10.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="26.39 62.83" transform="rotate(-90 170.0 178.0)"/><rect x="166.5" y="174.5" width="7" height="7" rx="1" fill="none" stroke="#e6e6e6" stroke-width="1"/><text x="190" y="182" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">CPU</text><text x="211.8" y="183" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#e6e6e6">42%</text><circle cx="349.0" cy="178.0" r="10.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="349.0" cy="178.0" r="10.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="15.71 62.83" transform="rotate(-90 349.0 178.0)"/><rect x="345.5" y="174.5" width="7" height="7" rx="1" fill="none" stroke="#e6e6e6" stroke-width="1"/><text x="369" y="182" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a