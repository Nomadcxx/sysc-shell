rt" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">13 residual, split above and below by centring</text><text x="470" y="330" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">HOLDS AT EVERY SUPPORTED FONT SCALE</text><text x="470" y="348" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#0f766e">75% 54/70    100% 57/70    125% 61/70    150% 65/70</text><text x="470" y="366" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#8a827a">200% 72/70 — the page already fails at this scale</text><text x="48" y="404" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#a16207">Ring interior type scales with the diameter: 14px value, 13px for a three-character temperature.</text>
