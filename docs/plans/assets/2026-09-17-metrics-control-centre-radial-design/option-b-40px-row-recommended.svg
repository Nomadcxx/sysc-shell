ircle cx="369.5" cy="185.0" r="19.0" fill="none" stroke="url(#gT)" stroke-width="2" stroke-linecap="round" stroke-dasharray="77.60 119.38" transform="rotate(-90 369.5 185.0)"/><text x="369.5" y="185.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#e6e6e6">65°</text><text x="369.5" y="218" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">Temp</text><circle cx="455.5" cy="185.0" r="19.0" fill="none" stroke="#9aa0a6" stroke-width="2"/><circle cx="455.5" cy="185.0" r="19.0" fill="none" stroke="url(#gA)" stroke-width="2" stroke-linecap="round" stroke-dasharray="83.57 119.38" transform="rotate(-90 455.5 185.0)"/><text x="455.5" y="185.0" text-anchor="middle" dominant-baseline="central" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#e6e6e6">70%</text><text x="455.5" y="218" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#9aa0a6">GPU</text><rect x="159" y="159" width="338" height="70" fill="none" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/><line x1="150" y1="114" x2="506" y2="114" stroke="#8a827a" stroke-width="1"/><line x1="150" y1="111" x2="150" y2="117" stroke="#8a827a" stroke-width="1"/><line x1="506" y1="111" x2="506" y2="117" stroke="#8a827a" stroke-width="1"/><text x="328.0" y="109" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a827a">356 card width</text><line x1="540" y1="150" x2="540" y2="238" stroke="#8a827a" stroke-width="1"/><line x1="537" y1="150" x2="543" y2="150" stroke="#8a827a" stroke-width="1"/><line x1="537" y1="238" x2="543" y2="238" stroke="#8a827a" stroke-width="1"/><text x="546" y="197.5" text-anchor="start" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="10" font-weight="400" fill="#8a82